<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Rishvin Labs</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="The requested page could not be found. Return to Rishvin Labs home page.">
    <meta name="robots" content="noindex, follow">
    <meta name="language" content="English">
    
    <!-- Fonts preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Favicon & Branding -->
    <link rel="icon" type="image/png" href="favicon/favicon.png" sizes="any">
    <link rel="apple-touch-icon" href="favicon/favicon.png">
    <meta name="theme-color" content="#0a0b0f">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS Architecture -->
    <link rel="stylesheet" href="assets/css/variables.css?v=2">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/components.css?v=2">

    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(2, 6, 23, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-orb 4s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse-orb {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        }

        .error-content {
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 5rem;
            font-weight: 700;
            color: var(--primary);
            opacity: 0.8;
            margin-bottom: var(--space-2);
            line-height: 1;
        }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="error-container">
        <div class="error-orb"></div>
        <div class="error-content animate-slide-up">
            <div class="error-code">404</div>
            <h1 style="font-size: 2.5rem; margin-bottom: var(--space-4);">System Error: Route Not Found</h1>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-8); font-size: 1.125rem;">Looks like you've entered an unknown path.</p>
            <div style="display: flex; gap: var(--space-4); justify-content: center; align-items: center;">
                <a href="index.html" class="btn btn-primary" style="padding: var(--space-3) var(--space-6);">
                    <i data-lucide="arrow-left" style="width: 18px; height: 18px; margin-right: 8px;"></i> Return Home
                </a>
                <a href="contact.html" class="btn btn-outline" style="padding: var(--space-3) var(--space-6);">
                    <i data-lucide="mail" style="width: 18px; height: 18px; margin-right: 8px;"></i> Contact Us
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="assets/js/main.js" defer>
    <script src="assets/js/nav-inject.js?v=4" defer></script>
    <script src="assets/js/navbar.js" defer></script></script>
</body>
</html>
